<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel · Mohamed & Habiba</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f7f0df;
    --ink: #2a2114;
    --muted: #9b7a43;
    --gold: #d4af37;
    --gold-deep: #7d5b18;
    --danger: #b3261e;
  }
  body {
    font-family: 'Cormorant Garamond', serif;
    background: linear-gradient(135deg, #fffaf0 0%, #f7f0df 48%, #efe0b8 100%);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid rgba(212,175,55,0.3);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 26px;
  }
  header p {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ─── LOGIN ─── */
  #login-view {
    max-width: 360px;
    margin: 60px auto;
    padding: 0 24px;
    text-align: center;
  }
  #login-view h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    margin-bottom: 18px;
  }
  .field {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 12px;
    background: rgba(255,255,255,0.6);
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    color: var(--ink);
  }
  .field:focus { outline: none; border-color: var(--gold); }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #8f681d, #d4af37 48%, #8f681d);
    color: #fffdf5;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-outline {
    background: transparent;
    border: 1px solid rgba(212,175,55,0.5);
    color: var(--gold-deep);
  }
  .error-msg {
    color: var(--danger);
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    margin-top: 10px;
    min-height: 14px;
  }

  /* ─── DASHBOARD ─── */
  #dashboard-view { display: none; padding: 20px 16px 60px; max-width: 720px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top-bar .btn-outline { width: auto; padding: 8px 18px; font-size: 11px; margin: 0; }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 20px;
    margin: 28px 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title .count {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  .wish-row {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .wish-row.is-pinned { border-color: var(--gold); background: rgba(255,233,166,0.35); }
  .wish-row .row-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 4px;
  }
  .wish-row .row-text { font-size: 17px; margin-bottom: 10px; line-height: 1.4; }
  .row-actions { display: flex; gap: 8px; }
  .row-actions button {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(212,175,55,0.4);
    background: rgba(255,255,255,0.7);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 0.5px;
    cursor: pointer;
    color: var(--ink);
  }
  .row-actions button.pin-btn.active { background: var(--gold); color: #fff; border-color: var(--gold); }
  .row-actions button.delete-btn { color: var(--danger); border-color: rgba(179,38,30,0.35); }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .gallery-tile {
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(212,175,55,0.3);
    background: rgba(255,255,255,0.6);
  }
  .gallery-tile.is-pinned { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,0.4); }
  .gallery-tile .media-wrap { aspect-ratio: 1/1; background: #ead7a5; }
  .gallery-tile img, .gallery-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-tile .row-actions { padding: 8px; }

  .empty-note {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>

<header>
  <h1>Owner Panel</h1>
  <p>Mohamed &amp; Habiba · 19.09.2026</p>
</header>

<!-- ─── LOGIN ─── -->
<div id="login-view">
  <h2>Sign in to manage the site</h2>
  <input type="email" id="login-email" class="field" placeholder="Admin email" autocomplete="username">
  <input type="password" id="login-password" class="field" placeholder="Password" autocomplete="current-password">
  <button type="button" class="btn" id="login-btn">Login</button>
  <p class="error-msg" id="login-error"></p>
</div>

<!-- ─── DASHBOARD ─── -->
<div id="dashboard-view">
  <div class="top-bar">
    <span style="font-family:'Montserrat',sans-serif;font-size:12px;color:var(--muted);" id="who-am-i"></span>
    <button type="button" class="btn btn-outline" id="logout-btn">Logout</button>
  </div>

  <div class="section-title">Well Wishes <span class="count" id="wishes-count"></span></div>
  <div id="wishes-list"></div>
  <p class="empty-note" id="wishes-empty" style="display:none;">No wishes yet.</p>

  <div class="section-title">Guest Memories <span class="count" id="gallery-count"></span></div>
  <div class="gallery-grid" id="gallery-list"></div>
  <p class="empty-note" id="gallery-empty" style="display:none;">No photos or videos yet.</p>
</div>

<!-- ═══ FIREBASE ═══ -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<!-- Same config file used by index.html — edit it once, in one place. -->
<script src="firebase-config.js"></script>
<script>
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const loginEmail = document.getElementById('login-email');
  const loginPassword = document.getElementById('login-password');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const logoutBtn = document.getElementById('logout-btn');
  const whoAmI = document.getElementById('who-am-i');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loginBtn.addEventListener('click', function () {
    loginError.textContent = '';
    loginBtn.disabled = true;
    // Firebase Authentication handles the password securely on Google's servers —
    // it is never stored or compared inside this page's code.
    auth.signInWithEmailAndPassword(loginEmail.value.trim(), loginPassword.value)
      .catch(function (err) {
        loginError.textContent = 'Wrong email or password.';
      })
      .finally(function () { loginBtn.disabled = false; });
  });

  logoutBtn.addEventListener('click', function () { auth.signOut(); });

  auth.onAuthStateChanged(function (user) {
    if (user) {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      whoAmI.textContent = user.email;
      loginPassword.value = '';
    } else {
      loginView.style.display = 'block';
      dashboardView.style.display = 'none';
    }
  });

  // ─── WISHES MODERATION ───
  (function initWishesAdmin() {
    const listEl = document.getElementById('wishes-list');
    const emptyEl = document.getElementById('wishes-empty');
    const countEl = document.getElementById('wishes-count');
    const rows = {};

    function reorder() {
      const els = Object.values(rows);
      els.sort(function (a, b) {
        const pa = a.dataset.pinned === '1', pb = b.dataset.pinned === '1';
        if (pa !== pb) return pa ? -1 : 1;
        return (Number(b.dataset.ts) || 0) - (Number(a.dataset.ts) || 0);
      });
      els.forEach(function (el) { listEl.appendChild(el); });
      countEl.textContent = els.length ? '(' + els.length + ')' : '';
      emptyEl.style.display = els.length ? 'none' : 'block';
    }

    function upsert(id, data) {
      if (!data) return;
      let row = rows[id];
      if (!row) {
        row = document.createElement('div');
        row.className = 'wish-row';
        rows[id] = row;
      }
      row.dataset.pinned = data.pinned ? '1' : '0';
      row.dataset.ts = data.timestamp || 0;
      row.classList.toggle('is-pinned', !!data.pinned);
      row.innerHTML =
        '<div class="row-name">' + escapeHtml(data.name || '') + '</div>' +
        '<div class="row-text">' + escapeHtml(data.message || '') + '</div>' +
        '<div class="row-actions">' +
          '<button type="button" class="pin-btn' + (data.pinned ? ' active' : '') + '">' + (data.pinned ? '📌 Pinned' : '📌 Pin') + '</button>' +
          '<button type="button" class="delete-btn">🗑 Delete</button>' +
        '</div>';
      row.querySelector('.pin-btn').addEventListener('click', function () {
        db.ref('wishes/' + id).update({ pinned: !data.pinned });
      });
      row.querySelector('.delete-btn').addEventListener('click', function () {
        if (confirm('Delete this wish?')) db.ref('wishes/' + id).remove();
      });
      reorder();
    }

    const ref = db.ref('wishes').limitToLast(200);
    ref.on('child_added', function (snap) { upsert(snap.key, snap.val()); });
    ref.on('child_changed', function (snap) { upsert(snap.key, snap.val()); });
    ref.on('child_removed', function (snap) { delete rows[snap.key]; reorder(); });
  })();

  // ─── GALLERY MODERATION ───
  (function initGalleryAdmin() {
    const listEl = document.getElementById('gallery-list');
    const emptyEl = document.getElementById('gallery-empty');
    const countEl = document.getElementById('gallery-count');
    const tiles = {};

    function reorder() {
      const els = Object.values(tiles);
      els.sort(function (a, b) {
        const pa = a.dataset.pinned === '1', pb = b.dataset.pinned === '1';
        if (pa !== pb) return pa ? -1 : 1;
        return (Number(b.dataset.ts) || 0) - (Number(a.dataset.ts) || 0);
      });
      els.forEach(function (el) { listEl.appendChild(el); });
      countEl.textContent = els.length ? '(' + els.length + ')' : '';
      emptyEl.style.display = els.length ? 'none' : 'block';
    }

    function upsert(id, data) {
      if (!data || !data.url) return;
      let tile = tiles[id];
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'gallery-tile';
        tiles[id] = tile;
      }
      tile.dataset.pinned = data.pinned ? '1' : '0';
      tile.dataset.ts = data.timestamp || 0;
      tile.classList.toggle('is-pinned', !!data.pinned);

      const mediaHtml = data.type === 'video'
        ? '<video src="' + data.url + '" muted playsinline controls></video>'
        : '<img src="' + data.url + '" alt="Guest upload" loading="lazy">';

      tile.innerHTML =
        '<div class="media-wrap">' + mediaHtml + '</div>' +
        '<div class="row-actions">' +
          '<button type="button" class="pin-btn' + (data.pinned ? ' active' : '') + '">' + (data.pinned ? '📌' : '📌 Pin') + '</button>' +
          '<button type="button" class="delete-btn">🗑</button>' +
        '</div>';
      tile.querySelector('.pin-btn').addEventListener('click', function () {
        db.ref('gallery-uploads/' + id).update({ pinned: !data.pinned });
      });
      tile.querySelector('.delete-btn').addEventListener('click', function () {
        if (!confirm('Remove from the site? (the file stays stored on Cloudinary — delete it there too if you want to free up space)')) return;
        db.ref('gallery-uploads/' + id).remove();
      });
      reorder();
    }

    const ref = db.ref('gallery-uploads').limitToLast(200);
    ref.on('child_added', function (snap) { upsert(snap.key, snap.val()); });
    ref.on('child_changed', function (snap) { upsert(snap.key, snap.val()); });
    ref.on('child_removed', function (snap) { delete tiles[snap.key]; reorder(); });
  })();
</script>
</body>
</html>
